[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bucex"
version = "1.0.0"
description = "Bayesian structural time series for environmental means and extremes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Bastiaan A. Van Velthoven"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=1.5", "threadpoolctl>=3.1"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
research = ["matplotlib>=3.7"]
dev = ["build>=1", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bucex*"]
